name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build e testes
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Relatório de testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: build/reports/tests/